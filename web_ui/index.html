<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>THE BLUEPRINTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08090c;
            --surface: #111318;
            --surface-2: #181b22;
            --surface-3: #1f232c;
            --border: #252a36;
            --border-hover: #353c4d;
            --accent: #6366f1;
            --accent-soft: rgba(99,102,241,0.12);
            --green: #22c55e;
            --green-soft: rgba(34,197,94,0.12);
            --red: #ef4444;
            --red-soft: rgba(239,68,68,0.12);
            --yellow: #eab308;
            --yellow-soft: rgba(234,179,8,0.12);
            --blue: #3b82f6;
            --blue-soft: rgba(59,130,246,0.12);
            --text: #f1f5f9;
            --text-2: #94a3b8;
            --text-3: #64748b;
            --text-4: #475569;
            --radius: 16px;
            --radius-sm: 10px;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

        /* ===== HEADER ===== */
        .header{position:sticky;top:0;z-index:100;background:rgba(8,9,12,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 24px}
        .header-inner{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
        .logo{font-size:1.4rem;font-weight:900;letter-spacing:0.08em;color:#fff}
        .header-right{display:flex;align-items:center;gap:8px}
        .status-chip{display:flex;align-items:center;gap:6px;font-size:0.85rem;font-weight:600;color:var(--text-2);background:var(--surface);padding:8px 16px;border-radius:20px;border:1px solid var(--border)}
        .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
        .dot.stale{background:var(--red);box-shadow:0 0 8px var(--red)}
        .dot.reconnecting{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:pulse 0.8s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
        .btn{font-family:inherit;font-size:0.85rem;font-weight:700;padding:8px 18px;border-radius:20px;border:none;cursor:pointer;transition:all 0.15s}
        .btn:active{transform:scale(0.95)}
        .btn-kill{background:var(--red-soft);color:var(--red);border:1px solid rgba(239,68,68,0.25)}
        .btn-kill:hover{background:var(--red);color:#fff}

        /* ===== MAIN ===== */
        .main{max-width:1400px;margin:0 auto;padding:28px 32px 80px}

        /* ===== HERO STATS ===== */
        .hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
        .hero-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;transition:border-color 0.2s}
        .hero-card:hover{border-color:var(--border-hover)}
        .hero-label{font-size:0.9rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px}
        .hero-value{font-size:3.2rem;font-weight:900;color:#fff;line-height:1}
        .hero-sub{font-size:0.95rem;color:var(--text-3);margin-top:10px}
        .hero-value.up{color:var(--green)}
        .hero-value.down{color:var(--red)}

        /* ===== STATUS BAR ===== */
        .status-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 24px;margin-bottom:28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
        .sb-item{display:flex;align-items:center;gap:8px;font-size:0.95rem;color:var(--text-2)}
        .sb-item strong{color:var(--text);font-weight:700}
        .sb-divider{width:1px;height:24px;background:var(--border);flex-shrink:0}
        .sb-pill{font-size:0.8rem;font-weight:700;padding:5px 14px;border-radius:12px;text-transform:uppercase;letter-spacing:0.04em}
        .sb-pill.open{background:var(--green-soft);color:var(--green)}
        .sb-pill.tripped{background:var(--red-soft);color:var(--red)}
        .progress-bar{flex:1;min-width:120px;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
        .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 1s linear}

        /* ===== SECTION ===== */
        .section{margin-bottom:36px}
        .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
        .section-title{font-size:1.3rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px}
        .badge{font-size:0.8rem;font-weight:700;background:var(--accent);color:#fff;padding:3px 10px;border-radius:10px}

        /* ===== POSITION CARDS ===== */
        .pos-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:14px;transition:border-color 0.2s}
        .pos-card:hover{border-color:var(--border-hover)}
        .pos-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
        .pos-city{font-size:1.4rem;font-weight:800;color:#fff}
        .pos-question{font-size:0.95rem;color:var(--text-2);margin-top:4px;line-height:1.4}
        .pos-resolve{font-size:0.88rem;font-weight:700;color:var(--yellow);white-space:nowrap}
        .pos-strat{font-size:0.75rem;font-weight:700;padding:4px 12px;border-radius:8px;text-transform:uppercase;letter-spacing:0.04em}
        .pos-strat.swing{background:var(--green-soft);color:var(--green)}
        .pos-strat.hold{background:var(--blue-soft);color:var(--blue)}

        /* Price progress */
        .price-track{margin:18px 0;position:relative}
        .price-labels{display:flex;justify-content:space-between;font-size:0.88rem;color:var(--text-3);margin-bottom:8px}
        .price-labels strong{color:var(--text)}
        .price-bar{height:10px;background:var(--surface-3);border-radius:5px;position:relative;overflow:visible}
        .price-fill{height:100%;border-radius:5px;transition:width 0.5s}
        .price-fill.profit{background:linear-gradient(90deg,var(--green),#4ade80)}
        .price-fill.loss{background:linear-gradient(90deg,var(--red),#f87171)}
        .price-marker{position:absolute;top:-4px;width:3px;height:16px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 6px rgba(255,255,255,0.4)}

        /* Metrics grid */
        .pos-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px}
        .metric{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px 16px}
        .metric-label{font-size:0.78rem;font-weight:600;color:var(--text-4);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
        .metric-value{font-size:1.05rem;font-weight:700;color:var(--text)}
        .metric-value.up{color:var(--green)}
        .metric-value.down{color:var(--red)}

        /* Actions */
        .pos-actions{display:flex;gap:10px;margin-top:18px}
        .pos-btn{font-family:inherit;font-size:0.85rem;font-weight:700;padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;text-decoration:none;transition:all 0.15s}
        .pos-btn:hover{background:var(--surface-3);color:#fff;border-color:var(--border-hover)}

        /* ===== CLOSED TRADES ===== */
        .trade-row{display:flex;align-items:center;gap:18px;padding:18px 22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;flex-wrap:wrap}
        .trade-city{font-weight:700;color:#fff;min-width:120px;font-size:1.05rem}
        .trade-prices{font-size:0.95rem;color:var(--text-2)}
        .trade-pnl{font-size:1.1rem;font-weight:800;min-width:100px}
        .trade-pnl.up{color:var(--green)}
        .trade-pnl.down{color:var(--red)}
        .trade-meta{font-size:0.85rem;color:var(--text-3);margin-left:auto}
        .pill{font-size:0.75rem;font-weight:700;padding:4px 12px;border-radius:8px;text-transform:uppercase;letter-spacing:0.03em}
        .pill-green{background:var(--green-soft);color:var(--green)}
        .pill-red{background:var(--red-soft);color:var(--red)}
        .pill-blue{background:var(--blue-soft);color:var(--blue)}
        .pill-yellow{background:var(--yellow-soft);color:var(--yellow)}

        /* ===== CYCLES ===== */
        .cycle-row{display:flex;align-items:center;gap:16px;padding:14px 20px;font-size:0.9rem;color:var(--text-2);border-bottom:1px solid var(--border)}
        .cycle-row:last-child{border-bottom:none}
        .cycle-time{font-weight:600;color:var(--text);min-width:130px}
        .cycle-opps{min-width:80px}
        .cycle-dur{color:var(--text-3);margin-left:auto}
        .cycles-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
        .cycles-more{text-align:center;padding:14px;font-size:0.88rem;color:var(--text-3);cursor:pointer;border-top:1px solid var(--border)}
        .cycles-more:hover{color:var(--accent)}

        /* ===== MODAL ===== */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto}
        .modal-title{font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:20px}
        .modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
        .modal-row:last-child{border-bottom:none}
        .modal-row-label{font-size:0.9rem;color:var(--text-3);font-weight:600}
        .modal-row-value{font-size:0.95rem;color:var(--text);font-weight:600;text-align:right;max-width:260px}
        .modal-divider{border:none;border-top:1px solid var(--border);margin:6px 0}
        .modal-source{font-size:0.8rem;color:var(--text-4);margin-top:14px;text-align:center}

        /* ===== EMPTY STATE ===== */
        .empty{text-align:center;padding:50px 20px;color:var(--text-3);font-size:1.05rem}
        .empty-icon{font-size:2.5rem;margin-bottom:10px;opacity:0.4}

        /* ===== RESPONSIVE ===== */
        @media(max-width:768px){
            .header{padding:12px 16px}
            .main{padding:16px 14px 60px}
            .hero{grid-template-columns:1fr;gap:10px}
            .hero-card{padding:20px;text-align:left;display:flex;align-items:center;justify-content:space-between}
            .hero-card .hero-label{margin-bottom:0;font-size:0.85rem}
            .hero-card .hero-value{font-size:2rem}
            .hero-card .hero-sub{display:none}
            .status-bar{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 18px}
            .sb-divider{display:none}
            .pos-card{padding:20px}
            .pos-header{flex-direction:column}
            .pos-city{font-size:1.2rem}
            .pos-metrics{grid-template-columns:1fr 1fr}
            .trade-row{flex-direction:column;align-items:flex-start;gap:8px;padding:14px 16px}
            .trade-meta{margin-left:0}
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-inner">
        <div class="logo">THE BLUEPRINTS</div>
        <div class="header-right">
            <div class="status-chip">
                <div class="dot" id="wsDot"></div>
                <span id="wsStatusText">Connecting</span>
                <span id="wsTime" style="color:var(--text-4)"></span>
            </div>
            <button class="btn btn-kill" onclick="triggerKillSwitch()">Kill Bot</button>
        </div>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- HERO STATS -->
    <div class="hero">
        <div class="hero-card">
            <div class="hero-label">Portfolio</div>
            <div class="hero-value" id="valPortfolio">--</div>
            <div class="hero-sub" id="metaPortfolio">Loading...</div>
        </div>
        <div class="hero-card">
            <div class="hero-label">Today's PnL</div>
            <div class="hero-value" id="valPnl">--</div>
            <div class="hero-sub" id="metaPnl">-</div>
        </div>
        <div class="hero-card">
            <div class="hero-label">Win Rate</div>
            <div class="hero-value" id="valWinRate">--</div>
            <div class="hero-sub" id="metaWinRate">-</div>
        </div>
    </div>

    <!-- STATUS BAR -->
    <div class="status-bar">
        <div class="sb-item"><span id="sbGate"></span></div>
        <div class="sb-divider"></div>
        <div class="sb-item" id="sbHealth">--</div>
        <div class="sb-divider"></div>
        <div class="sb-item"><span style="color:var(--text-4)">WIB</span> <strong id="sbClock">--:--</strong></div>
        <div class="sb-divider"></div>
        <div class="sb-item" id="sbCycle">--</div>
        <div class="progress-bar"><div class="progress-fill" id="sbProgress" style="width:0%"></div></div>
    </div>

    <!-- OPEN POSITIONS -->
    <div class="section">
        <div class="section-head">
            <div class="section-title">Open Positions <span class="badge" id="posCount">0</span></div>
        </div>
        <div id="positionsContainer">
            <div class="empty"><div class="empty-icon">~</div>No active positions</div>
        </div>
    </div>

    <!-- CLOSED TRADES -->
    <div class="section">
        <div class="section-head">
            <div class="section-title">Closed Trades <span class="badge" id="closedCount">0</span></div>
        </div>
        <div id="historyContainer">
            <div class="empty">No closed trades yet</div>
        </div>
    </div>

    <!-- DISCOVERY CYCLES -->
    <div class="section">
        <div class="section-head">
            <div class="section-title">Recent Cycles</div>
        </div>
        <div class="cycles-box" id="cyclesContainer">
            <div class="empty" style="padding:20px">Waiting for first cycle...</div>
        </div>
    </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="reasonModal" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">Entry Reasoning</div>
        <div id="modalBody"></div>
        <div class="modal-source" id="modalSource"></div>
    </div>
</div>

<script>
// ===== CONSTANTS =====
const CYCLE_PAGE_SIZE = 15;
const PAPER_LOOP_INTERVAL_S = 300;
const STALE_THRESHOLD_MS = 600000;
const IN_CYCLE_THRESHOLD_MS = 300000;

// ===== STATE =====
let latestPositions = [];
let latestCash = 0;
let latestDailyBaseline = 0;
let latestHistory = [];  // [P1-FIX] Persist history for WS updates
let latestDailyTarget = 0;
let cycleRowsCache = [];
let lastCycleTs = null;
let lastUpdatedAt = null;
let wsSocket = null;
let wsReconnectAttempts = 0;
let wsReconnectTimer = null;
let lastReceivedAt = 0;
let showAllCycles = false;

// ===== UTILITIES =====
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function trunc(v,n=80){const t=String(v??'').trim();return t.length<=n?t:t.slice(0,n-3)+'...'}

function getMarketLabel(p){
    const q=String(p?.market_question||'').trim();
    if(q)return trunc(q,80);
    const c=String(p?.city||'').trim();
    return c?c.toUpperCase()+' market':'Unknown';
}

function fmtDur(ms){
    if(!ms||ms<0)return'-';
    const s=Math.floor(ms/1000);
    if(s<60)return s+'s';
    const m=Math.floor(s/60),rs=s%60;
    if(m<60)return m+'m '+rs+'s';
    const h=Math.floor(m/60),rm=m%60;
    if(h<24)return h+'h '+rm+'m';
    return Math.floor(h/24)+'d '+h%24+'h';
}

function fmtWib(iso){
    if(!iso)return'-';
    try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'short',hour12:false}).format(new Date(iso))}catch{return iso}
}

function fmtWibShort(iso){
    if(!iso)return'-';
    try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short',hour12:false}).format(new Date(iso))}catch{return iso}
}

function timeAgo(iso){
    if(!iso)return'';
    const ms=Date.now()-new Date(iso).getTime();
    if(ms<60000)return'just now';
    if(ms<3600000)return Math.floor(ms/60000)+'m ago';
    if(ms<86400000)return Math.floor(ms/3600000)+'h ago';
    return Math.floor(ms/86400000)+'d ago';
}

function getPolyUrl(p){
    let s=(p.market_slug||'').replace(/-[0-9]+([cf](orhigher|orbelow)?)?$/i,'');
    return s?`https://polymarket.com/event/${s}`:`https://polymarket.com/search?query=${encodeURIComponent(p.market_question||p.city||'')}`;
}

function pnlClass(v){return v>=0?'up':'down'}
function pnlSign(v){return v>=0?'+':''}

// ===== SHOW REASON MODAL =====
function showReason(posData){
    const p=posData;if(!p)return;
    const city=String(p.city||'').toUpperCase();
    const dir=String(p.direction||'above').toLowerCase();
    const th=Number(p.threshold||0);
    const thH=p.threshold_high?Number(p.threshold_high):null;
    const unit=String(p.unit||'C');
    const prob=(Number(p.entry_model_prob||0)*100).toFixed(1);
    const edge=(Number(p.entry_edge||0)*100).toFixed(1);
    const price=Number(p.entry_price||0);
    const forecast=p.entry_forecast!=null?Number(p.entry_forecast):null;
    const qty=Number(p.quantity||0);
    const cost=Number(p.cost_basis||0);
    const fee=Number(p.entry_fee_usd||0);
    const strat=p.target_strategy==='hold_until_resolve'?'FORTRESS':'SWING';
    const ensemble=p.entry_ensemble_applied||false;
    const conf=p.entry_confidence_score?Number(p.entry_confidence_score).toFixed(2):null;

    let dirLabel='';
    if(dir==='above'){
        const alt=unit==='C'?(th*9/5+32).toFixed(1):((th-32)*5/9).toFixed(1);
        dirLabel=`ABOVE ${th}\u00B0${unit} (${alt}\u00B0${unit==='C'?'F':'C'})`;
    }else if(dir==='below'){
        const alt=unit==='C'?(th*9/5+32).toFixed(1):((th-32)*5/9).toFixed(1);
        dirLabel=`BELOW ${th}\u00B0${unit} (${alt}\u00B0${unit==='C'?'F':'C'})`;
    }else{
        dirLabel=thH?`BETWEEN ${th}-${thH}\u00B0${unit}`:`EXACT ${th}\u00B0${unit}`;
    }

    let forecastLine='',marginLine='';
    if(forecast!==null){
        const fF=(forecast*9/5+32).toFixed(1);
        forecastLine=`<div class="modal-row"><span class="modal-row-label">Forecast</span><span class="modal-row-value" style="color:var(--green)">${forecast.toFixed(1)}\u00B0C (${fF}\u00B0F)</span></div>`;
        let thC=unit==='F'?(th-32)*5/9:th;
        const diff=forecast-thC;
        const isGood=(dir==='above'&&diff>0)||(dir==='below'&&diff<0);
        marginLine=`<div class="modal-row"><span class="modal-row-label">Margin</span><span class="modal-row-value" style="color:var(${isGood?'--green':'--red'})">${Math.abs(diff).toFixed(1)}\u00B0C ${diff>0?'above':'below'} threshold</span></div>`;
    }

    const html=`
        <div class="modal-row"><span class="modal-row-label">Direction</span><span class="modal-row-value">${dirLabel}</span></div>
        ${forecastLine}${marginLine}
        <hr class="modal-divider">
        <div class="modal-row"><span class="modal-row-label">Probability</span><span class="modal-row-value" style="color:var(--blue)">${prob}%</span></div>
        <div class="modal-row"><span class="modal-row-label">Market Price</span><span class="modal-row-value">$${price.toFixed(4)}</span></div>
        <div class="modal-row"><span class="modal-row-label">Edge</span><span class="modal-row-value" style="color:var(--green)">+${edge}%</span></div>
        <hr class="modal-divider">
        <div class="modal-row"><span class="modal-row-label">Strategy</span><span class="modal-row-value"><span class="pill ${strat==='SWING'?'pill-green':'pill-blue'}">${strat}</span></span></div>
        <div class="modal-row"><span class="modal-row-label">Stake</span><span class="modal-row-value">${qty.toFixed(0)} x $${price.toFixed(4)} = $${cost.toFixed(2)}</span></div>
        ${conf?`<div class="modal-row"><span class="modal-row-label">Confidence</span><span class="modal-row-value">${conf}</span></div>`:''}
        ${p.entry_bucket_reason?`<div class="modal-row"><span class="modal-row-label">Bucket</span><span class="modal-row-value" style="font-size:0.7rem;max-width:200px;text-align:right">${esc(String(p.entry_bucket_reason).replace(/_/g,' '))}</span></div>`:''}
    `;
    document.getElementById('modalTitle').textContent=`Entry Reasoning \u2014 ${city}`;
    document.getElementById('modalBody').innerHTML=html;
    document.getElementById('modalSource').textContent=ensemble?'Sources: Open-Meteo + GFS Ensemble + wtr.in':'Sources: Open-Meteo + wtr.in';
    document.getElementById('reasonModal').classList.add('active');
}

// ===== CLOSE REASON DISPLAY =====
function getCloseReasonDisplay(reason){
    const r=String(reason).toLowerCase();
    let pc='pill-yellow',label=reason.replace(/_/g,' ').toUpperCase(),detail='';
    if(/take_profit_100pct/.test(r)){pc='pill-green';label='TAKE PROFIT';detail='Target price reached'}
    else if(/sniper_take_profit|sniper/.test(r)){pc='pill-green';label='SNIPER TP';detail='Price surged above $0.90'}
    else if(/stop_loss/.test(r)){pc='pill-red';label='STOP LOSS';detail='Price dropped below stop-loss'}
    else if(/hold_to_resolve|resolve/.test(r)){pc='pill-blue';label='RESOLVED';detail='Held until resolution'}
    else if(/haiku_monitor_exit|haiku|ai|monitor/.test(r)){pc='pill-yellow';label='AI EXIT';detail='AI recommended exit'}
    else if(/broken_thesis/.test(r)){pc='pill-yellow';label='BROKEN THESIS';detail='Forecast invalidated'}
    else if(/trailing_stop|trailing/.test(r)){pc='pill-yellow';label='TRAILING STOP';detail='Pullback from peak'}
    return{pc,label,detail};
}

// ===== RENDER: HERO STATS =====
function renderHero(positions,cash,history,dailyBaseline){
    // Portfolio
    let openMark=0,openCost=0;
    positions.forEach(p=>{
        const bid=Number(p.last_price||p.entry_quote_best_bid||0);
        openMark+=bid*Number(p.quantity||0);
        openCost+=Number(p.cost_basis||0);
    });
    const portfolio=cash+openMark;
    const floatingPnl=openMark-openCost;

    const portEl=document.getElementById('valPortfolio');
    portEl.textContent='$'+portfolio.toFixed(2);
    portEl.className='hero-value';
    document.getElementById('metaPortfolio').textContent=`Cash: $${cash.toFixed(2)} | Deployed: $${openCost.toFixed(2)}`;

    // Today's PnL (floating + realized TODAY only)
    // [P1-FIX] Filter history to only include trades closed today (UTC)
    const todayStr=new Date().toISOString().slice(0,10);
    let realizedPnl=0;
    history.forEach(p=>{
        const closedDate=(p.closed_at||'').slice(0,10);
        if(closedDate===todayStr) realizedPnl+=Number(p.realized_pnl_usd||0);
    });
    const totalPnl=floatingPnl+realizedPnl;
    const pnlEl=document.getElementById('valPnl');
    pnlEl.textContent=`${pnlSign(totalPnl)}$${Math.abs(totalPnl).toFixed(2)}`;
    pnlEl.className='hero-value '+pnlClass(totalPnl);
    document.getElementById('metaPnl').textContent=`Floating: ${pnlSign(floatingPnl)}$${Math.abs(floatingPnl).toFixed(4)} | Realized: ${pnlSign(realizedPnl)}$${Math.abs(realizedPnl).toFixed(4)}`;

    // Win Rate (all-time, not today-only — more meaningful with small sample)
    let wins=0,losses=0;
    history.forEach(p=>{if(Number(p.realized_pnl_usd||0)>=0)wins++;else losses++});
    const total=wins+losses;
    const wr=total>0?(wins/total*100):0;
    const wrEl=document.getElementById('valWinRate');
    wrEl.textContent=total>0?wr.toFixed(0)+'%':'--';
    wrEl.className='hero-value '+(total===0?'':(wr>=50?'up':'down'));
    document.getElementById('metaWinRate').textContent=total>0?`${wins}W / ${losses}L | Avg: ${pnlSign(realizedPnl/total)}$${Math.abs(realizedPnl/total).toFixed(4)}`:'No trades yet';
}

// ===== RENDER: STATUS BAR =====
function renderStatusBar(cycleData,dailyBaseline,dailyTarget){
    // Gate
    const gateEl=document.getElementById('sbGate');
    const last=cycleRowsCache[0];
    const gateOpen=last?(last.entry_gate_open!==false):true;
    const gateReason=last?.entry_gate_reason||'unknown';
    gateEl.innerHTML=gateOpen
        ?`<span class="sb-pill open">Gate: ${esc(gateReason)}</span>`
        :`<span class="sb-pill tripped">Gate: ${esc(gateReason)}</span>`;

    // Health + next cycle
    const timestamps=[];
    if(lastCycleTs)timestamps.push(lastCycleTs.getTime());
    if(lastUpdatedAt)timestamps.push(lastUpdatedAt.getTime());
    if(lastReceivedAt)timestamps.push(lastReceivedAt);
    const mostRecent=timestamps.length?Math.max(...timestamps):0;

    const healthEl=document.getElementById('sbHealth');
    const progEl=document.getElementById('sbProgress');
    const cycleEl=document.getElementById('sbCycle');

    if(!mostRecent){
        healthEl.innerHTML='Waiting...';
        progEl.style.width='0%';
        cycleEl.textContent='';
        return;
    }

    const ageMs=Date.now()-mostRecent;
    const ageS=Math.floor(ageMs/1000);
    const nextInS=Math.max(0,PAPER_LOOP_INTERVAL_S-ageS);
    const progress=Math.min(100,((PAPER_LOOP_INTERVAL_S-nextInS)/PAPER_LOOP_INTERVAL_S)*100);

    if(ageMs>STALE_THRESHOLD_MS){
        healthEl.innerHTML=`<span style="color:var(--red)">STALE ${fmtDur(ageMs)}</span>`;
    }else if(ageMs>IN_CYCLE_THRESHOLD_MS){
        healthEl.innerHTML=`<span style="color:var(--yellow)">In cycle...</span>`;
    }else{
        healthEl.innerHTML=`<span style="color:var(--green)">Healthy</span>`;
    }

    progEl.style.width=progress+'%';
    cycleEl.textContent=nextInS>0?`Next: ~${fmtDur(nextInS*1000)}`:'Running...';
}

// ===== RENDER: POSITIONS =====
function renderPositions(){
    const container=document.getElementById('positionsContainer');
    document.getElementById('posCount').textContent=latestPositions.length;

    if(!latestPositions.length){
        container.innerHTML='<div class="empty"><div class="empty-icon">~</div>No active positions</div>';
        return;
    }

    // Sort by urgency: positions with end_date closest to now first
    const sorted=[...latestPositions].sort((a,b)=>{
        const aEnd=a.end_date?new Date(a.end_date).getTime():Infinity;
        const bEnd=b.end_date?new Date(b.end_date).getTime():Infinity;
        return aEnd-bEnd;
    });

    let html='';
    sorted.forEach((pos,idx)=>{
        const entry=Number(pos.entry_price||0);
        const bid=Number(pos.last_price||pos.entry_quote_best_bid||0);
        const sl=Number(pos.stop_loss_price||0);
        const tp=Number(pos.target_price||1);
        const cost=Number(pos.cost_basis||0);
        const qty=Number(pos.quantity||0);
        const fee=Number(pos.entry_fee_usd||0);
        const pnl=(bid*qty)-cost;
        const pnlPct=cost>0?((pnl/cost)*100):0;
        const prob=Number(pos.entry_model_prob||0);
        const edge=Number(pos.entry_edge||0);
        const city=String(pos.city||'').toUpperCase();
        const question=esc(getMarketLabel(pos));
        const strat=pos.target_strategy==='hold_until_resolve'?'hold':'swing';

        // Resolve countdown
        let resolveText='';
        if(pos.end_date){
            const ms=new Date(pos.end_date).getTime()-Date.now();
            if(ms>0)resolveText='Resolves in '+fmtDur(ms);
            else resolveText='Resolving...';
        }

        // Price progress: where is current price between SL and TP?
        const range=tp-sl;
        const fillPct=range>0?Math.max(0,Math.min(100,((bid-sl)/range)*100)):50;
        const entryPct=range>0?Math.max(0,Math.min(100,((entry-sl)/range)*100)):50;
        const isProfit=bid>=entry;

        // Find the real index in latestPositions for the onclick
        const realIdx=latestPositions.indexOf(pos);

        html+=`
        <div class="pos-card">
            <div class="pos-header">
                <div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <span class="pos-city">${city}</span>
                        <span class="pos-strat ${strat}">${strat.toUpperCase()}</span>
                    </div>
                    <div class="pos-question">${question}</div>
                </div>
                <div style="text-align:right">
                    ${resolveText?`<div class="pos-resolve">${resolveText}</div>`:''}
                    <div style="font-size:0.68rem;color:var(--text-4)">${timeAgo(pos.opened_at)}</div>
                </div>
            </div>

            <div class="price-track">
                <div class="price-labels">
                    <span>SL <strong style="color:var(--red)">$${sl.toFixed(2)}</strong></span>
                    <span>Entry <strong>$${entry.toFixed(2)}</strong></span>
                    <span>Now <strong style="color:var(${isProfit?'--green':'--red'})">$${bid.toFixed(2)}</strong></span>
                    <span>TP <strong style="color:var(--green)">$${tp.toFixed(2)}</strong></span>
                </div>
                <div class="price-bar">
                    <div class="price-fill ${isProfit?'profit':'loss'}" style="width:${fillPct}%"></div>
                    <div class="price-marker" style="left:${entryPct}%"></div>
                </div>
            </div>

            <div class="pos-metrics">
                <div class="metric">
                    <div class="metric-label">PnL</div>
                    <div class="metric-value ${pnlClass(pnl)}">${pnlSign(pnl)}$${Math.abs(pnl).toFixed(4)} (${pnlSign(pnlPct)}${Math.abs(pnlPct).toFixed(1)}%)</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Probability</div>
                    <div class="metric-value" style="color:var(--blue)">${(prob*100).toFixed(0)}%</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Edge</div>
                    <div class="metric-value" style="color:var(--green)">+${(edge*100).toFixed(1)}%</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Cost</div>
                    <div class="metric-value">$${cost.toFixed(2)} <span style="color:var(--text-4);font-size:0.68rem">(${qty.toFixed(0)} shares)</span></div>
                </div>
            </div>

            <div class="pos-actions">
                <a href="${getPolyUrl(pos)}" target="_blank" class="pos-btn">View on Polymarket</a>
                <button class="pos-btn" onclick="showReason(latestPositions[${realIdx}])">Entry Logic</button>
            </div>
        </div>`;
    });

    container.innerHTML=html;
}

    }

    const sorted=[...closed].sort((a,b)=>new Date(b.closed_at)-new Date(a.closed_at)).slice(0,30);
    let html='';
    sorted.forEach(pos=>{
        const pnl=Number(pos.realized_pnl_usd||0);
        const roi=Number(pos.realized_roi_pct||0);
        const reason=pos.close_reason||pos.reason||'unknown';
        const{pc,label}=getCloseReasonDisplay(reason);
        const city=String(pos.city||'').toUpperCase();

// ===== RENDER: CYCLES =====
function renderCycles(){
    const container=document.getElementById('cyclesContainer');
    if(!cycleRowsCache.length){
        container.innerHTML='<div class="empty" style="padding:20px">Waiting for first cycle...</div>';
        return;
    }

    const limit=showAllCycles?cycleRowsCache.length:6;
    const rows=cycleRowsCache.slice(0,limit);

    let html='';
    rows.forEach(c=>{
        const gateOpen=c.entry_gate_open!==false;
        const gateReason=c.entry_gate_reason||'unknown';
        const gatePill=gateOpen
            ?`<span class="pill pill-green" style="font-size:0.6rem">${esc(gateReason)}</span>`
            :`<span class="pill pill-red" style="font-size:0.6rem">${esc(gateReason)}</span>`;
        const opps=c.counts?.opportunities||0;
        const opened=c.counts?.opened||0;
        const durMs=c.performance?.total_ms||0;

        html+=`
        <div class="cycle-row">
            <span class="cycle-time">${fmtWibShort(c.timestamp)}</span>
            ${gatePill}
            <span class="cycle-opps">${opps} opps${opened>0?` <strong style="color:var(--green)">+${opened}</strong>`:''}</span>
            <span class="cycle-dur">${durMs>0?(durMs/1000).toFixed(0)+'s':'-'}</span>
        </div>`;
    });

    if(cycleRowsCache.length>6&&!showAllCycles){
        html+=`<div class="cycles-more" onclick="showAllCycles=true;renderCycles()">Show all ${cycleRowsCache.length} cycles</div>`;
    }else if(showAllCycles&&cycleRowsCache.length>6){
        html+=`<div class="cycles-more" onclick="showAllCycles=false;renderCycles()">Show less</div>`;
    }

    container.innerHTML=html;
}

// ===== WEBSOCKET =====
function getWsUrl(){
    const proto=location.protocol==='https:'?'wss:':'ws:';
    return`${proto}//${location.hostname||'localhost'}:8081`;
}

function setWsStatus(state,text){
    const dot=document.getElementById('wsDot');
    const st=document.getElementById('wsStatusText');
    const tm=document.getElementById('wsTime');
    if(!dot||!st)return;
    dot.className='dot';
    if(state==='reconnecting')dot.classList.add('reconnecting');
    else if(state!=='live')dot.classList.add('stale');
    st.textContent=text;
    if(tm)tm.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false});
}

function scheduleWsReconnect(){
    if(wsReconnectTimer)clearTimeout(wsReconnectTimer);
    wsReconnectAttempts++;
    const delay=Math.min(30000,3000*(2**Math.min(wsReconnectAttempts-1,4)));
    setWsStatus('reconnecting',`Reconnecting (${Math.round(delay/1000)}s)`);
    wsReconnectTimer=setTimeout(connectBrowserWs,delay);
}

function updatePositionLiveByToken(tokenId,bidPrice){
    const pos=latestPositions.find(p=>String(p.token_id)===tokenId);
    if(!pos)return;
    pos.last_price=Number(bidPrice);
    // [P1-FIX] Use latestHistory instead of [] to preserve realized PnL during WS updates
    renderHero(latestPositions,latestCash,latestHistory,latestDailyBaseline);
    renderPositions();
}

function handleWsMessage(raw){
    let msg;try{msg=JSON.parse(raw)}catch{return}
    lastReceivedAt=Date.now();
    setWsStatus('live','Live');
    if(msg.type==='price_update')updatePositionLiveByToken(String(msg.token_id||''),Number(msg.bid_price||0));
    else if(msg.type==='position_closed'||msg.type==='position_opened')setTimeout(fetchData,500);
}

function connectBrowserWs(){
    if(wsReconnectTimer)clearTimeout(wsReconnectTimer);
    try{
        wsSocket=new WebSocket(getWsUrl());
        wsSocket.onopen=()=>{wsReconnectAttempts=0;setWsStatus('live','Live')};
        wsSocket.onmessage=e=>handleWsMessage(e.data);
        wsSocket.onclose=()=>{setWsStatus('reconnecting','Reconnecting...');scheduleWsReconnect()};
        wsSocket.onerror=()=>{};
    }catch{scheduleWsReconnect()}
}

// ===== FETCH DATA =====
async function fetchData(){
    try{
        let data;
        try{
            const r=await fetch('/api/state?t='+Date.now(),{cache:'no-store'});
            if(r.ok)data=await r.json();
        }catch(_){}
        if(!data){
            const r=await fetch('../logs/paper_positions_5usd.json?t='+Date.now(),{cache:'no-store'});
            if(!r.ok)throw new Error(`HTTP ${r.status}`);
            data=await r.json();
        }

        // Cycles
        const rawCycles=data.cycle_journal||[];
        const seen=new Set();
        cycleRowsCache=rawCycles.filter(c=>{if(!c.timestamp||seen.has(c.timestamp))return false;seen.add(c.timestamp);return true}).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));

        // Positions
        latestPositions=(data.positions||[]).map(p=>({...p,last_price:Number(p.last_price||p.entry_quote_best_bid||0)}));

        const closed=data.history||[];
        latestHistory=closed;  // [P1-FIX] Persist for WS updates
        const meta=data.meta||{};
        const baseWallet=Number(meta.base_wallet||5.0);
        latestCash=Number(meta.cash||meta.current_wallet||baseWallet);

        // Daily session
        const daily=meta.daily_session||{};
        latestDailyBaseline=Number(daily.baseline_wallet||baseWallet);
        latestDailyTarget=Number(daily.target_wallet||latestDailyBaseline*2);

        // Timestamps
        const lastCycle=cycleRowsCache[0];
        lastCycleTs=lastCycle?new Date(lastCycle.timestamp):null;
        lastUpdatedAt=data.updated_at?new Date(data.updated_at):null;

        // Render everything
        renderHero(latestPositions,latestCash,closed,latestDailyBaseline);
        renderStatusBar(lastCycle,latestDailyBaseline,latestDailyTarget);
        renderPositions();
        renderHistory(closed);
        renderCycles();

    }catch(e){
        console.error('[fetchData]',e);
    }
}

function getCommandServerUrl(){return''}
function triggerKillSwitch(){
    if(!confirm('EMERGENCY KILL-SWITCH\n\nBot akan berhenti setelah siklus saat ini selesai.\nSemua posisi terbuka tetap tersimpan aman.\n\nLanjutkan?'))return;
    const token=prompt('Masukkan Kill Token (KILL_API_TOKEN):');
    if(!token)return;
    const btn=document.querySelector('.btn-kill');
    if(btn){btn.disabled=true;btn.textContent='Sending...'}
    fetch(`${getCommandServerUrl()}/api/kill`,{method:'POST',headers:{'X-Kill-Token':token}})
        .then(r=>r.json())
        .then(d=>{alert('Kill signal terkirim.\n\n'+(d.message||''));if(btn)btn.textContent='Kill Sent'})
        .catch(err=>{alert('Gagal: '+err);if(btn){btn.disabled=false;btn.textContent='Kill Bot'}});
}
